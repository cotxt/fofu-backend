name: fofu-production

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: fofu-api:production
    env_file:
      - ${FOFU_CONFIG_FILE:-/etc/fofu/production.env}
    environment:
      # These values exist only in the environment of the short-lived Compose
      # process and the API container. compose-with-ssm.sh fetches them at runtime.
      FOFU_DATABASE_URL: ${FOFU_DATABASE_URL:?FOFU_DATABASE_URL was not loaded from SSM}
      FOFU_JWT_SECRET: ${FOFU_JWT_SECRET:?FOFU_JWT_SECRET was not loaded from SSM}
    # Caddy has this fixed address on the dedicated internal proxy network.
    # Trust only that address so other local processes cannot spoof client IPs.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=172.30.0.2
    restart: unless-stopped
    init: true
    expose:
      - "8000"
    networks:
      proxy-internal:
        ipv4_address: 172.30.0.3
      api-egress: {}
    volumes:
      - fofu-uploads:/app/var/uploads
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

  proxy:
    image: caddy:2.11.4-alpine
    environment:
      FOFU_DOMAIN: ${FOFU_DOMAIN:?Set FOFU_DOMAIN in /etc/fofu/production.env}
      FOFU_TLS_EMAIL: ${FOFU_TLS_EMAIL:?Set FOFU_TLS_EMAIL in /etc/fofu/production.env}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      proxy-internal:
        ipv4_address: 172.30.0.2
      proxy-egress: {}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:2015/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

volumes:
  fofu-uploads:
  caddy-data:
  caddy-config:

networks:
  # Only Caddy and the API join this network. It has no route outside Docker.
  proxy-internal:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  # Separate one-service networks provide outbound RDS and ACME access without
  # placing another container on an API-reachable shared network.
  api-egress: {}
  proxy-egress: {}
